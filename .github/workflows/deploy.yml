name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate public site
        run: node scripts/check-site.cjs

      # Stamps the footer in the published copy only. main is never modified,
      # so no commit-back and no write access to the source branch is needed.
      - name: Stamp footer date
        env:
          TZ: Europe/Istanbul
        run: |
          LAST_UPDATED=$(git log -1 --format=%cd --date=format:'%B %d, %Y')
          YEAR=$(git log -1 --format=%cd --date=format:'%Y')
          sed -i "s|<span id=\"footer-updated\">[^<]*</span>|<span id=\"footer-updated\">${LAST_UPDATED}</span>|" index.html
          sed -i "s|<span id=\"footer-year\">[^<]*</span>|<span id=\"footer-year\">${YEAR}</span>|" index.html
          echo "Stamped: ${LAST_UPDATED} (year ${YEAR})"
          grep -o '<span id="footer-updated">[^<]*</span>' index.html
          MODIFIED=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${MODIFIED}</lastmod>|" sitemap.xml

      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml site.webmanifest _site/
          cp googlec3d2fe7a9e66be57.html _site/
          cp -R assets images my-portfolio _site/
          touch _site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          enable_jekyll: false
